[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpq"
version = "0.1.0"
description = "Mac-first reference implementation for hierarchy-aware residual progressive quantization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HARP-Q contributors" }]
dependencies = ["numpy>=2.0,<3"]

[project.scripts]
harpq = "harpq.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
