name: CPU reference

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/runtime.lock
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes liburing-dev
      - run: python -m pip install --requirement requirements/build.lock --requirement requirements/runtime.lock
      - run: make check PYTHON=python NATIVE_CUDA=OFF NATIVE_IO_URING="$NATIVE_IO_URING"
        env:
          NATIVE_IO_URING: ${{ runner.os == 'Linux' && 'AUTO' || 'OFF' }}
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/harpq-wheel
